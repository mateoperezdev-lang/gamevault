<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameVault - Registro</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <h1 class="logo"><i class="fas fa-gamepad"></i> GameVault</h1>
            <h2>Crear Cuenta</h2>
            
            <form id="registerForm">
                <div class="form-group">
                    <label for="username"><i class="fas fa-user"></i> Nombre de usuario</label>
                    <input type="text" id="username" placeholder="usuario123" required>
                </div>
                
                <div class="form-group">
                    <label for="email"><i class="fas fa-envelope"></i> Email</label>
                    <input type="email" id="email" placeholder="tu@email.com" required>
                </div>
                
                <div class="form-group">
                    <label for="password"><i class="fas fa-lock"></i> Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                
                <div class="form-group">
                    <label for="confirmPassword"><i class="fas fa-lock"></i> Confirmar Contraseña</label>
                    <input type="password" id="confirmPassword" placeholder="••••••••" required>
                </div>
                
                <button type="submit" class="auth-button">Registrarse</button>
            </form>
            
            <p class="auth-link">
                <a href="index.html"><i class="fas fa-arrow-left"></i> Volver al inicio</a>
                | ¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a>
            </p>
            
            <p class="auth-note" style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 20px;">
                <i class="fas fa-info-circle"></i> Serás redirigido al inicio si no realizas ninguna acción en 30 segundos.
            </p>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
